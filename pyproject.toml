[project]
name = "jkUnicode"
version = "2.7.2"
description = "Unicode support libraries"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jens Kutílek", email = "webmail@kutilek.de" }]
classifiers = [
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = []

[project.urls]
"Bug Tracker" = "https://github.com/jenskutilek/jkUnicode/issues"
"Changelog" = "https://github.com/jenskutilek/jkUnicode/blob/master/CHANGELOG.md"
"Documentation" = "https://jkunicode.readthedocs.io/en/latest/"
"Homepage" = "https://github.com/jenskutilek/jkUnicode"

[project.scripts]
ortho = "jkUnicode.cmdline.ortho:ortho"
uniinfo = "jkUnicode.cmdline.uniinfo:uniinfo"

[project.optional-dependencies]
all = [
  "jkUnicode[sfnt]",
  "jkUnicode[woff]",
]
sfnt = ["fonttools >= 4.65.0"]
woff = ["fonttools[woff] >= 4.65.0"]

[dependency-groups]
dev = [
  "hyperglot >= 0.8.2",
  "mypy >= 2.4.0",
  "ruff >= 0.17.3",
]
doc = [
  "sphinx_rtd_theme >= 3.1.0",
  "sphinx >= 9.0.4",  # For Python 3.11
]
test = [
  "pytest-cov >= 7.1.0",
  "pytest >= 9.2.0",
  "tox-gh >= 1.9.1",
  "tox-uv >= 1.37.2",
  "tox >= 4.67.4",
  { include-group = "dev" },
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.ruff]
extend-exclude = ["stubs"]

[tool.ruff.lint]
future-annotations = false
ignore = ["N999"]

[tool.ruff.lint.isort]
known-first-party = ["jkUnicode"]

[tool.uv.build-backend]
module-name = "jkUnicode"
